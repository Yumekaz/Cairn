# NoCloud network-config v2, rendered only for a new disposable fixture.
version: 2
renderer: networkd
ethernets:
  cairn0:
    match:
      macaddress: "@MAC@"
    set-name: cairn0
    dhcp4: false
    dhcp6: false
    accept-ra: false
    link-local: []
    addresses:
      - @GUEST@/@PREFIX@
    routes:
      - to: 0.0.0.0/0
        via: @HOST@
    nameservers:
      addresses:
        - @DNS@
