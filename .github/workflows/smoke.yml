name: smoke

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  packaged-system-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: Cairn
      - name: Read exact package dependencies
        id: packages
        working-directory: Cairn
        run: |
          for project in DURAFLOW Mini-Docker; do
            revision=$(awk -v project="$project" '$1==project {print $2}' stack.lock)
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
            key=${project//-/_}
            echo "$key=$revision" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/checkout@v4
        with:
          repository: Yumekaz/DURAFLOW
          ref: ${{ steps.packages.outputs.DURAFLOW }}
          path: DURAFLOW
      - uses: actions/checkout@v4
        with:
          repository: Yumekaz/Mini-Docker
          ref: ${{ steps.packages.outputs.Mini_Docker }}
          path: Mini-Docker
      - uses: actions/setup-go@v5
        with:
          go-version-file: Cairn/go.mod
      - name: Offline package build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv busybox-static iproute2 iptables
          python3 -m venv Mini-Docker/venv
          Mini-Docker/venv/bin/pip install build setuptools wheel
          mkdir -p Mini-Docker/rootfs/bin
          cp /usr/bin/busybox Mini-Docker/rootfs/bin/busybox
      - name: Package, install and verify actual system services
        working-directory: Cairn
        run: |
          set -euo pipefail
          mkdir -p bin verification
          go build -o bin/cairn ./cmd/cairn
          bin/cairn init
          chmod 700 "$HOME/.cairn"
          python3 scripts/system_install.py prepare --output "$PWD/verification/bundle" > verification/prepare.log 2>&1
          digest=$(sha256sum verification/bundle/manifest.json | awk '{print $1}')
          sudo python3 scripts/system_install.py apply --bundle "$PWD/verification/bundle" --manifest-sha256 "$digest" --prefix /usr/local/lib/cairn > verification/install.log 2>&1
          python3 scripts/verify_installed_admin.py > verification/admin.jsonl
          export CAIRN_ROOTFS=$(find /usr/local/lib/cairn/releases -name installation.json -printf '%h/rootfs\n')
          export MINI_DOCKER_SOCKET=/run/cairn-runtime/mini-docker.sock
          NOTES_PROOF_PORT=8093 python3 scripts/notes_smoke.py > verification/notes.json
          proof_service=$(python3 -c 'import json; print(json.load(open("verification/notes.json"))["service"])')
          python3 scripts/verify_installed_recovery.py --service "$proof_service" --port 8093 > verification/recovery.jsonl
          systemctl is-enabled cairn.service cairn-runtime.service > verification/boot-enabled.txt
          systemctl show cairn.service cairn-runtime.service -p User -p Group -p ExecStart -p ActiveState > verification/units.txt
      - name: Stop only the test installation
        if: always()
        run: sudo systemctl disable --now cairn.service cairn-runtime.service || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cairn-packaged-system-install
          path: |
            Cairn/verification/*.log
            Cairn/verification/*.json
            Cairn/verification/*.jsonl
            Cairn/verification/*.txt
  stateful-spine-and-databases:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: Cairn
      - name: Read locked deployment-stack revisions
        id: spine
        working-directory: Cairn
        run: |
          for project in DURAFLOW Mini-Docker; do
            revision=$(awk -v project="$project" '$1==project {print $2}' stack.lock)
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
            key=${project//-/_}
            echo "$key=$revision" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/checkout@v4
        with:
          repository: Yumekaz/DURAFLOW
          ref: ${{ steps.spine.outputs.DURAFLOW }}
          path: DURAFLOW
      - uses: actions/checkout@v4
        with:
          repository: Yumekaz/Mini-Docker
          ref: ${{ steps.spine.outputs.Mini_Docker }}
          path: Mini-Docker
      - uses: actions/setup-go@v5
        with:
          go-version-file: Cairn/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare real namespace runtime prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static iproute2 iptables
          mkdir -p Mini-Docker/rootfs/{bin,dev,proc,sys,tmp,etc}
          cp /usr/bin/busybox Mini-Docker/rootfs/bin/busybox
          for applet in sh echo cat sleep dd mkdir rmdir sync httpd printf; do ln -sf busybox "Mini-Docker/rootfs/bin/$applet"; done
      - name: Build exact Cairn implementation
        working-directory: Cairn
        run: |
          mkdir -p bin
          go build -o bin/cairn ./cmd/cairn
          go build -o bin/cairnd ./cmd/cairnd
      - name: Real stateful deployment and recovery spine
        working-directory: Cairn
        run: bash scripts/ci_spine_proof.sh
      - name: Real PostgreSQL Redis and MongoDB recovery drivers
        working-directory: Cairn
        run: |
          docker pull postgres:18
          docker pull redis:7-bookworm
          docker pull mongo:7
          CAIRN_TEST_POSTGRES_IMAGE=postgres:18 bash scripts/verify_database_drivers.sh verification/databases
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cairn-stateful-spine-and-databases
          path: |
            Cairn/verification/*.log
            Cairn/verification/*.json
            Cairn/verification/databases/*.log
            Cairn/verification/databases/*.txt
            Cairn/verification/databases/images.json
  unit-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Sibling layout: GITHUB_WORKSPACE/{Cairn,DURAFLOW} matches go.mod replace => ../DURAFLOW
        working-directory: Cairn
    steps:
      - name: Checkout Cairn
        uses: actions/checkout@v4
        with:
          path: Cairn

      # go.mod: replace github.com/yumekaz/duraflow => ../DURAFLOW
      - name: Read pinned DuraFlow revision
        id: stack
        run: |
          revision=$(awk '$1=="DURAFLOW" {print $2}' stack.lock)
          test "${#revision}" -eq 40
          echo "duraflow=$revision" >> "$GITHUB_OUTPUT"
      - name: Checkout DuraFlow (sibling)
        uses: actions/checkout@v4
        with:
          repository: Yumekaz/DURAFLOW
          ref: ${{ steps.stack.outputs.duraflow }}
          path: DURAFLOW

      - uses: actions/setup-go@v5
        with:
          # Match go.mod (1.26.x); 1.22.x cannot build this module.
          go-version-file: Cairn/go.mod
          cache-dependency-path: Cairn/go.sum

      - name: Unit tests (core packages)
        run: |
          go test ./cmd/... ./internal/... -count=1

      - name: Build binaries
        run: |
          go build -o bin/cairn ./cmd/cairn
          go build -o bin/cairnd ./cmd/cairnd
      - name: Control-plane race detector (required)
        run: CGO_ENABLED=1 go test -race ./internal/... -count=1 -timeout 10m
      - name: Supported source installation on clean Linux runner
        run: |
          bash scripts/install.sh
          test -x "$HOME/.local/bin/cairn"
          test -x "$HOME/.local/bin/cairnd"
          "$HOME/.local/bin/cairn" --help

      - name: Demo script dry syntax check
        run: |
          for s in scripts/*.sh scripts/vm/*.sh; do bash -n "$s"; done
      - name: Verification runner regressions
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Dashboard focus and cron lifecycle regressions
        run: node --test scripts/dashboard_focus.test.cjs scripts/dashboard_events_harness.test.cjs internal/daemon/dashboard/cron_lifecycle_test.cjs

      - name: Note on full reliability gate
        run: |
          echo "The stateful-spine job runs real privileged Mini-Docker deployment and real database recovery. VM reboot/crash, browser controls and elapsed-time soaks retain separate acceptance evidence."
